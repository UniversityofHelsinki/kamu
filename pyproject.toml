[project]
name = "kamu"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "crispy-bootstrap5==2026.9",
    "django==5.2.18",
    "django-crispy-forms==2.7",
    "django-filter==26.1",
    "django-stubs-ext==5.2.9",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "pycountry==26.2.16",
    "python-json-logger==4.2.0",
    "python-ldap==3.4.8",
    "requests==2.34.2",
]

[project.optional-dependencies]
mysql = [
    "mysqlclient==2.3.0",
]
postgresql = [
    "psycopg==3.3.6",
]

[tool.uv]
audit.malware-check = true
exclude-newer = "7 days"
exclude-newer-package = { django = false, certifi = "P3D" }

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.black]
line-length = 119

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = [
    '^venv/$',
    '^tests/$',
]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
strict_optional = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[tool.django-stubs]
django_settings_module = "settings.test"

[dependency-groups]
dev = [
    "black==26.10.1",
    "coverage==7.16.2",
    "django-stubs==5.2.9",
    "djangorestframework-stubs==3.16.9",
    "faker==40.43.0",
    "flake8==7.4.1",
    "isort==9.0.2",
    "mypy==1.20.2",
    "sphinx==8.1.3",
    "sphinxcontrib-django==2.5",
    "tblib==3.2.2",
    "types-requests==2.33.0.20261006",
]
graph = [
    "django-extensions==4.1",
    "pygraphviz==1.14",
]